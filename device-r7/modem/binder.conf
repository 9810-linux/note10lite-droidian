# r7 oFono binder plugin config — /etc/ofono/binder.conf
#
# Stock file is just the slot definition; the signalStrengthRange line is the
# r7 addition. See README.md ("Signal bar reads far too low").
#
# ofono-binder-plugin maps dBm -> percent with:
#     percent = (dbm <= weak) ? 1 : (dbm >= strong) ? 100
#             : 100 * (dbm - weak) / (strong - weak)
# and its defaults are weak=-100, strong=-60 (BINDER_DEFAULT_SLOT_DBM_WEAK /
# _STRONG in binder_plugin.c). Those numbers suit RSSI, but on LTE the plugin
# feeds RSRP straight in as dBm (binder_netreg_dbm_from_rsrp: dbm = -rsrp).
# RSRP runs ~20-25 dB below RSSI for the same real signal, so ordinary good
# LTE (-95..-105 dBm RSRP) lands at or under the -100 "weak" clamp and the bar
# pins to 1%. Occasional 70% readings were the modem sitting on GSM/WCDMA,
# where the dBm really does come from RSSI.
#
# Values below are Android's standard LTE RSRP bar thresholds
# (AOSP lteRsrpThresholds -128/-118/-108/-98 = 1..4 bars), giving:
#   -128 -> 1%   -118 -> 33%   -113 -> 50%   -108 -> 67%   -98 -> 100%

[Settings]
ExpectSlots = slot1

[slot1]
path = /ril_0
slot = 0
signalStrengthRange = -128,-98
