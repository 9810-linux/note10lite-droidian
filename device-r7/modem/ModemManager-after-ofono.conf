# r7: ofono2mm (which IS ModemManager.service here, via the packaged
# 10-ofono2mm.conf drop-in) ships only "After=polkit.service" and races
# ofono.service — on this device it loses the race by ~11s every boot and
# comes up "failed / sim-missing" ("SIM not detected" in the UI).
# Install as /etc/systemd/system/ModemManager.service.d/20-r7-after-ofono.conf
[Unit]
After=ofono.service
Wants=ofono.service
