# r7: WebKitGTK dlopen()s unversioned libEGL.so / libGLESv2.so, which Droidian ships
# only as versioned glvnd dispatchers. Provide the dev symlinks so WebKit gets EGL
# (-> libhybris -> Mali) and can HW-decode/display HTML5 video. See device-r7/video/.
L+ /usr/lib/aarch64-linux-gnu/libEGL.so    - - - - libEGL.so.1
L+ /usr/lib/aarch64-linux-gnu/libGLESv2.so - - - - libGLESv2.so.2
